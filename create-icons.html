<!DOCTYPE html>
<html>
<head>
  <title>2FA Icon Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1c2128; color: white; }
    canvas { border: 1px solid #5f5f87; margin: 10px; background: #000; }
    .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>2FA Icon PNG Generator</h2>
  <p>Click the button below to generate PNG versions of your icons. After clicking, check your browser console for instructions on how to save them if needed, or simply use the generated images.</p>
  
  <button class="btn" onclick="generate()">Generate All Icons</button>
  
  <div id="canvases"></div>

  <script>
    const sizes = [16, 32, 48, 128];
    const icons = ['icon-locked.svg', 'icon-unlocked.svg', 'icon-base.svg'];

    async function generate() {
      const container = document.getElementById('canvases');
      container.innerHTML = '';

      for (const icon of icons) {
        for (const size of sizes) {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          container.appendChild(canvas);
          const ctx = canvas.getContext('2d');
          
          const img = new Image();
          img.src = 'icons/' + icon;
          await new Promise(r => img.onload = r);
          
          ctx.drawImage(img, 0, 0, size, size);
          console.log(`Generated ${icon} at ${size}px`);
        }
      }
      alert('Icons generated on screen! You can right-click and "Save Image As" to replace the icons in your folder.');
    }
  </script>
</body>
</html>
