<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#grad)"/>
  <g transform="translate(64, 64)">
    <!-- Lock body -->
    <rect x="-30" y="-10" width="60" height="50" rx="5" fill="white"/>
    <!-- Lock shackle -->
    <path d="M -20 -15 A 20 20 0 0 1 20 -15" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="0" cy="10" r="8" fill="#4CAF50"/>
    <rect x="-3" y="10" width="6" height="15" fill="#4CAF50"/>
  </g>
</svg>
